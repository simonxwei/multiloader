modLoader="javafml"
loaderVersion="${neoforge_javafml_version_range}"
license="${mod_license}"
licenseURL="${mod_license_url}"
issueTrackerURL="${mod_issues}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_author}"
credits="${mod_credits}"
displayURL="${mod_homepage}"
iconFile="${mod_icon}"
bannerFile="${mod_banner}"
# NeoForge 26.2+ separates the square list icon from the details-panel banner.
# iconBlur=false
description='''
${mod_description}
'''

[features.${mod_id}]
javaVersion="[${java_version},)"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[mixins]]
config="${mod_id}.mixins.json"
# Optional NeoForge Mixin metadata when a config genuinely needs it:
# requiredMods=["other_mod"]
# behaviorVersion="0.17.1"

[[mixins]]
config="${mod_id}.client.mixins.json"

[[mixins]]
config="${mod_id}.neoforge.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neoforge_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
