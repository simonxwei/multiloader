plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

sourceSets.main.resources {
    srcDir('src/generated/resources')

    // Exclude development-only assets from packaged resources.
    exclude('**/*.bbmodel')
    exclude('**/.cache/**')
}

// Keep development-only dependencies out of published metadata.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

neoForge {
    version = project.neoforge_version

    validateAccessTransformers = true

    // Apply the shared Access Transformer during NeoForge compilation.
    accessTransformers.from(project(':common').file('src/main/resources/META-INF/accesstransformer.cfg'))

    runs {
        client {
            client()
            systemProperty 'terminal.jline', 'true'
            programArguments.addAll '--username', project.username
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            systemProperty 'terminal.jline', 'false'
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod',
                    project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
            systemProperty 'terminal.ansi', 'true'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Expose shared client output to IDE resolution; compile sources below.
    compileOnly this.project(':common').sourceSets.client.output

}

// Expand template properties into generated NeoForge mod metadata.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            mod_id                          : mod_id,
            mod_version                     : mod_version,
            mod_name                        : mod_name,
            mod_author                      : mod_author,
            mod_credits                     : mod_credits,
            mod_description                 : mod_description,
            mod_homepage                    : mod_homepage,
            mod_issues                      : mod_issues,
            mod_license                     : mod_license,
            mod_license_url                 : mod_license_url,
            mod_icon                        : mod_icon,
            mod_banner                      : mod_banner,
            minecraft_version               : minecraft_version,
            minecraft_version_range         : minecraft_version_range,
            java_version                    : java_version,
            neoforge_version                : neoforge_version,
            neoforge_javafml_version_range  : neoforge_javafml_version_range
    ]

    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

// Include generated metadata in Gradle and IDE resources.
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// Compile shared client sources into NeoForge's Dist-aware universal mod.
tasks.named('compileJava', JavaCompile).configure {
    source(configurations.commonClientJava)
}

processResources {
    from(project(':common').file('src/client/resources'))
}

tasks.named('javadoc', Javadoc).configure {
    source(configurations.commonClientJava)
}

// Forward stdin to the dedicated server without enabling JLine.
tasks.named('runServer') {
    standardInput = System.in
}

// Match the loader attribute used by compatible multiloader tooling.
// See https://github.com/mcgradleconventions
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)

['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { configurationName ->
    configurations.named(configurationName) {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}

sourceSets.configureEach { sourceSet ->
    [sourceSet.compileClasspathConfigurationName,
     sourceSet.runtimeClasspathConfigurationName,
     sourceSet.getTaskName(null, 'jarJar')].each { configurationName ->
        configurations.named(configurationName) {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}
