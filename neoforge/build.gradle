plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude development-only resources from finalized outputs.
    exclude('**/*.bbmodel')
    exclude('**/.cache/**')
}

// Keep optional development-only dependencies out of published metadata.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

neoForge {
    version = project.neoforge_version

    // Validate AT files and raise errors when they have invalid targets.
    validateAccessTransformers = true

    // Apply the shared Access Transformer while compiling common sources for NeoForge.
    accessTransformers.from(project(':common').file('src/main/resources/META-INF/accesstransformer.cfg'))

    // Default run configurations.
    runs {
        client {
            client()
            systemProperty 'terminal.jline', 'true'
            programArguments.addAll '--username', project.username
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            systemProperty 'terminal.jline', 'false'
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod',
                    project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
            systemProperty 'terminal.ansi', 'true'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Expose the shared client output to Gradle's IDE model.
    // The raw shared client sources are still compiled into
    // this loader's main output.
    compileOnly this.project(':common').sourceSets.client.output

}

// This block expands all declared replacement properties into neoforge.mods.toml.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            mod_id                          : mod_id,
            mod_version                     : mod_version,
            mod_name                        : mod_name,
            mod_author                      : mod_author,
            mod_credits                     : mod_credits,
            mod_description                 : mod_description,
            mod_homepage                    : mod_homepage,
            mod_issues                      : mod_issues,
            mod_license                     : mod_license,
            mod_license_url                 : mod_license_url,
            mod_icon                        : mod_icon,
            mod_banner                      : mod_banner,
            minecraft_version               : minecraft_version,
            minecraft_version_range         : minecraft_version_range,
            java_version                    : java_version,
            neoforge_version                : neoforge_version,
            neoforge_javafml_version_range  : neoforge_javafml_version_range
    ]

    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

// Include generated metadata in the main resources for both Gradle and IDE builds.
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// NeoForge keeps its Dist-aware universal source model.
// Shared client code is physically separate in common,
// then compiled into the NeoForge mod here.
tasks.named('compileJava', JavaCompile).configure {
    source(configurations.commonClientJava)
}

processResources {
    from(project(':common').file('src/client/resources'))
}

tasks.named('javadoc', Javadoc).configure {
    source(configurations.commonClientJava)
}

// Keep the dedicated server console interactive without enabling JLine.
// Gradle JavaExec tasks otherwise default to an empty standard input stream.
tasks.named('runServer') {
    standardInput = System.in
}

// multiloader: identify NeoForge-compatible incoming and outgoing variants.
// This follows the mcgradleconventions loader attribute used by the upstream
// MultiLoader Template and interoperable multiloader tooling.
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)

['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { configurationName ->
    configurations.named(configurationName) {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}

sourceSets.configureEach { sourceSet ->
    [sourceSet.compileClasspathConfigurationName,
     sourceSet.runtimeClasspathConfigurationName,
     sourceSet.getTaskName(null, 'jarJar')].each { configurationName ->
        configurations.named(configurationName) {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}
