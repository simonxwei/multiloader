plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

loom {
    splitEnvironmentSourceSets()

    accessWidenerPath = project(':common').file("src/main/resources/${mod_id}.classtweaker")

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        client {
            programArguments.addAll '--username', project.username
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

dependencies {
    // Expose shared client output to IDE resolution; compile sources below.
    clientCompileOnly this.project(':common').sourceSets.client.output

    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

processResources {
    def replaceProperties = [
            mod_id               : mod_id,
            mod_package          : mod_package,
            mod_version          : mod_version,
            mod_name             : mod_name,
            mod_description      : mod_description.replace('\n', '\\n'),
            mod_author           : mod_author,
            mod_homepage         : mod_homepage,
            mod_sources          : mod_sources,
            mod_issues           : mod_issues,
            mod_license          : mod_license,
            mod_icon             : mod_icon,
            minecraft_version    : minecraft_version,
            java_version         : java_version,
            fabric_loader_version: fabric_loader_version
    ]

    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

// Compile shared client sources separately to preserve physical-side isolation.
tasks.named('compileClientJava', JavaCompile).configure {
    source(configurations.commonClientJava)
}

tasks.named('processClientResources', ProcessResources).configure {
    from(project(':common').file('src/client/resources'))
}

tasks.named('javadoc', Javadoc).configure {
    source(configurations.commonClientJava)
    classpath += sourceSets.client.compileClasspath
}

// Match the loader attribute used by compatible multiloader tooling.
// See https://github.com/mcgradleconventions
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)

['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements',
 'includeInternal', 'modCompileClasspath'].each { configurationName ->
    configurations.named(configurationName) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}

sourceSets.configureEach { sourceSet ->
    [sourceSet.compileClasspathConfigurationName, sourceSet.runtimeClasspathConfigurationName].each { configurationName ->
        configurations.named(configurationName) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
