plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
}

group = mod_group_id
version = "${mod_version}+mc${minecraft_version}"

base {
    archivesName = "${mod_id}-${project.name}"
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Fabric'
                url = uri('https://maven.fabricmc.net/')
            }
        }

        filter {
            includeGroupAndSubgroups('net.fabricmc')
        }
    }

    mavenCentral()
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    sourceCompatibility = JavaVersion.toVersion(java_version)
    targetCompatibility = JavaVersion.toVersion(java_version)

    withSourcesJar()
    withJavadocJar()
}

dependencies {
    compileOnly("net.fabricmc:sponge-mixin:${mixin_version}")
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixin_extras_version}"))
}

// Expand Mixin placeholders across main and client resource tasks.
def commonResourceProperties = [
        mod_package      : mod_package,
        mixin_min_version: mixin_min_version,
        java_version     : java_version
]

tasks.withType(ProcessResources).configureEach {
    inputs.properties commonResourceProperties

    filesMatching('**/*.mixins.json') {
        expand commonResourceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = java_version as int
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    // Exclude Git placeholders from generated Javadoc.
    exclude('**/.gitkeep')

    options.encoding = 'UTF-8'
    options.docEncoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.locale = 'en_US'
    options.addBooleanOption('Xdoclint:all,-missing', true)
}

tasks.withType(Jar).configureEach {
    // Exclude Git placeholders from binary and source JARs.
    exclude('**/.gitkeep')

    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.version,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

// Root publication tasks include common, Fabric, and NeoForge.
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }

    repositories {
        // Publish to repo/ unless local_maven_url overrides the destination.
        maven {
            name = 'local'
            url = uri(System.getenv('local_maven_url') ?: rootProject.file('repo'))
        }

        // Add remote Maven repositories here when needed.
    }
}

// Download dependency sources and Javadoc for IDE navigation.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
