# Gradle Properties
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
## IntelliJ IDEA is not yet fully compatible with configuration cache.
## See https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Environment Properties
minecraft_version=26.3
minecraft_version_range=[26.3, 26.4)
java_version=25
## Offline player name used by development client runs.
username=dev

# Mixin Properties
## See https://github.com/FabricMC/fabric-loader/blob/master/gradle.properties#L12
## See https://github.com/neoforged/NeoForge/blob/26.3.x/gradle.properties
mixin_version=0.17.3+mixin.0.8.7
## Minimum Sponge Mixin subsystem version required by the packaged Mixin configs.
mixin_min_version=0.8.7
mixin_extras_version=0.5.4

# Fabric Properties
## See https://fabricmc.net/develop/
fabric_loom_version=1.17-SNAPSHOT
fabric_loader_version=0.19.5
fabric_api_version=0.160.6+26.3

# NeoForge Properties
## See https://projects.neoforged.net/neoforged/moddevgradle
neoforge_moddev_version=2.0.147
## See https://projects.neoforged.net/neoforged/neoform
neoforge_neoform_version=26.3-1
## See https://projects.neoforged.net/neoforged/neoforge
neoforge_version=26.3.0.3-beta
## JavaFML language-loader compatibility range used by neoforge.mods.toml.
neoforge_javafml_version_range=[1,)

# Mod Properties
mod_id=template
mod_name=Template
## Initial version of mods created from this template; independent of template release tags.
mod_version=1.0.0
## See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=io.github.simonxwei.template
mod_package=io.github.simonxwei.template
mod_author=simonxwei
mod_credits=
## See https://choosealicense.com/
mod_license=CC0-1.0
## Keep this URL aligned with mod_license when changing the template license.
mod_license_url=https://creativecommons.org/publicdomain/zero/1.0/
mod_icon=icon.png
mod_banner=banner.png
mod_description=A personal Gradle template for developing a single Minecraft mod for Fabric and NeoForge.
mod_homepage=https://github.com/simonxwei/multiloader
mod_sources=https://github.com/simonxwei/multiloader
mod_issues=https://github.com/simonxwei/multiloader/issues
