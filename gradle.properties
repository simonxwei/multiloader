# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
## Disable configuration cache until IDE support is reliable.
## See https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Minecraft and Environment
minecraft_version=26.3
minecraft_version_range=[26.3, 26.4)
java_version=25
## Player name for local development runs.
username=dev

# Mixin
## See https://github.com/FabricMC/fabric-loader/blob/master/gradle.properties#L12
## See https://github.com/neoforged/NeoForge/blob/26.3.x/gradle.properties
mixin_version=0.17.5+mixin.0.8.7
## Minimum Mixin version declared in packaged configurations.
mixin_min_version=0.8.7
mixin_extras_version=0.5.5

# Fabric
## See https://fabricmc.net/develop/
fabric_loom_version=1.19-SNAPSHOT
fabric_loader_version=0.20.1
fabric_api_version=0.165.0+26.3

# NeoForge
## See https://projects.neoforged.net/neoforged/moddevgradle
neoforge_moddev_version=2.0.148
## See https://projects.neoforged.net/neoforged/neoform
neoforge_neoform_version=26.3-1
## See https://projects.neoforged.net/neoforged/neoforge
neoforge_version=26.3.0.99
## JavaFML compatibility range in neoforge.mods.toml.
neoforge_javafml_version_range=[1,)

# Mod
## Mod identity is independent of `rootProject.name`; update the URLs for the new repository.
mod_id=template
mod_name=Template
## Example mod version; independent of `multiloader` release tags.
mod_version=1.0.0
## See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=io.github.simonxwei.template
## Also refactor Java packages and META-INF/services descriptors.
mod_package=io.github.simonxwei.template
mod_author=simonxwei
mod_credits=
## See https://choosealicense.com/
mod_license=CC0-1.0
## Keep the URL consistent with mod_license.
mod_license_url=https://creativecommons.org/publicdomain/zero/1.0/
mod_icon=icon.png
mod_banner=banner.png
mod_description=A personal Gradle template for developing a single Minecraft mod for Fabric and NeoForge.
mod_homepage=https://github.com/simonxwei/multiloader
mod_sources=https://github.com/simonxwei/multiloader
mod_issues=https://github.com/simonxwei/multiloader/issues
