plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

sourceSets {
    main {
        resources.srcDir('src/generated/resources')
    }

    client {
        // Keep common main independent of shared client sources.
        compileClasspath += main.output
        runtimeClasspath += main.output
    }
}

configurations {
    clientImplementation.extendsFrom implementation
    clientCompileOnly.extendsFrom compileOnly
    clientRuntimeOnly.extendsFrom runtimeOnly
    clientAnnotationProcessor.extendsFrom annotationProcessor
}

neoForge {
    // Use NeoForm for Minecraft access without loader-specific APIs.
    neoFormVersion = project.neoforge_neoform_version

    // Provide vanilla dependencies to the separate client source set.
    addModdingDependenciesTo sourceSets.client

    validateAccessTransformers = true

    // Apply the shared Access Transformer during common compilation.
    accessTransformers.from(file('src/main/resources/META-INF/accesstransformer.cfg'))
}

// Export shared sources for loader compilation; keep common independently compilable.
def commonJava = configurations.create('commonJava') {
    canBeDeclared = false
    canBeResolved = false
    canBeConsumed = true
}

def commonClientJava = configurations.create('commonClientJava') {
    canBeDeclared = false
    canBeResolved = false
    canBeConsumed = true
}

artifacts.add(commonJava.name, file('src/main/java'))
artifacts.add(commonClientJava.name, file('src/client/java'))

// Verify client sources during build without adding them to common main.
tasks.named('build').configure {
    dependsOn(tasks.named('clientClasses'))
}

// Match the loader attribute used by compatible multiloader tooling.
// See https://github.com/mcgradleconventions
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)

['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { configurationName ->
    configurations.named(configurationName) {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}

sourceSets.configureEach { sourceSet ->
    [sourceSet.compileClasspathConfigurationName, sourceSet.runtimeClasspathConfigurationName].each { configurationName ->
        configurations.named(configurationName) {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}
